# Neon PostgreSQL datasource. Provide these values via environment variables
# (DATABASE_JDBC_URL must include sslmode=require for Neon).
spring.datasource.url=${DATABASE_JDBC_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
# The base profile disables JDBC metadata access for H2; on PostgreSQL Hibernate needs it so ddl-auto=update can see existing tables/columns.
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=true
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
# Neon free-tier pooler/compute can drop idle connections; keep the pool small and short-lived.
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.keepalive-time=60000
spring.datasource.hikari.initialization-fail-timeout=-1
# Production must supply its own signing secret; there is deliberately no default.
app.jwt.secret=${JWT_SECRET}
# Public health output must not expose DB details.
management.endpoint.health.show-details=never
