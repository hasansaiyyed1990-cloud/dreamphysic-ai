# Neon PostgreSQL datasource. Provide these values via environment variables.
spring.datasource.url=${DATABASE_JDBC_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000,capacitor://localhost,http://localhost,https://localhost,${APP_CORS_ORIGINS:*}
