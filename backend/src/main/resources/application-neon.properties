# Neon PostgreSQL datasource. Provide these values via environment variables
# (DATABASE_JDBC_URL must include sslmode=require for Neon).
spring.datasource.url=${DATABASE_JDBC_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
# The base profile disables JDBC metadata access for H2; on PostgreSQL Hibernate needs it so ddl-auto=update can see existing tables/columns.
# The base profile pins H2Dialect for local H2; production PostgreSQL must override it,
# otherwise Hibernate generates H2-flavoured DDL against Neon and saves can fail with 500s.
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=true
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=true
spring.jpa.hibernate.ddl-auto=${HIBERNATE_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jackson.time-zone=Asia/Kolkata
# Neon free-tier pooler/compute can drop idle connections; keep the pool small and short-lived.
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.keepalive-time=60000
spring.datasource.hikari.initialization-fail-timeout=-1
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000,capacitor://localhost,http://localhost,https://localhost,*
# Production secrets are required and must be supplied through Railway/Neon environment variables.
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:604800000}
app.gemini.api-key=${GEMINI_API_KEY}
app.gemini.model=${GEMINI_MODEL:gemini-2.5-flash}
app.gemini.fallback-model=${GEMINI_FALLBACK_MODEL:gemini-2.5-flash-lite}
app.gemini.timeout-ms=${GEMINI_TIMEOUT_MS:30000}
app.ai.daily-limit-per-user=${AI_DAILY_LIMIT_PER_USER:30}
app.ai.global-daily-killswitch=${AI_GLOBAL_DAILY_KILLSWITCH:1000}
app.latest-version=${APP_LATEST_VERSION:1.0.0}
app.apk-download-url=${APP_APK_DOWNLOAD_URL:}
# Public health output must not expose DB details.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
# Never leak stack traces, exception class names or messages in HTTP error responses.
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-exception=false
server.error.whitelabel.enabled=false
