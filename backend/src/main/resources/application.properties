# Server
server.port=${PORT:8080}
server.forward-headers-strategy=framework
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
spring.application.name=Dream Physic AI: Personal Trainer for Bodybuilding

# Virtual Threads
spring.threads.virtual.enabled=true

# Default local datasource (in-memory; no PostgreSQL port or local database files required)
spring.datasource.url=jdbc:h2:mem:dreamphysicdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# HikariCP
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=45000
spring.datasource.hikari.validation-timeout=10000
spring.datasource.hikari.initialization-fail-timeout=30000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.keepalive-time=30000
spring.datasource.hikari.connection-test-query=SELECT 1

# Jackson: dates are serialized in IST regardless of host timezone
spring.jackson.time-zone=Asia/Kolkata

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Bounded image/form uploads; Gemini photo requests use the same request cap.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
server.tomcat.max-http-form-post-size=15MB

# JWT
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:604800000}

# Gemini API
app.gemini.api-key=${GEMINI_API_KEY:${GOOGLE_API_KEY:your-gemini-api-key}}
app.gemini.base-url=https://generativelanguage.googleapis.com/v1beta
app.gemini.model=${GEMINI_MODEL:gemini-3.5-flash}
app.gemini.fallback-model=${GEMINI_FALLBACK_MODEL:gemini-flash-lite-latest}
app.gemini.timeout-ms=${GEMINI_TIMEOUT_MS:30000}

# AI Quotas
app.ai.daily-limit-per-user=${AI_DAILY_LIMIT_PER_USER:30}
app.ai.global-daily-killswitch=${AI_GLOBAL_DAILY_KILLSWITCH:1000}

# App Version
app.latest-version=${APP_LATEST_VERSION:1.0.0}
app.apk-download-url=${APP_APK_DOWNLOAD_URL:}

# Mail (optional; logs OTP in dev if host is unset)
app.mail.from=${MAIL_FROM:noreply@dreamphysic.ai}

# Cache
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=500,expireAfterWrite=600s

# CORS
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000,capacitor://localhost,http://localhost,https://localhost,*

# Never leak stack traces, exception class names or messages in HTTP error responses
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-exception=false
server.error.whitelabel.enabled=false

# Actuator: only health is exposed, and only health is permitted in SecurityConfig
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Run schema.sql after Hibernate creates/updates tables (widens legacy varchar columns)
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.continue-on-error=true
