# Server
server.port=8080
spring.application.name=dreamphysic-ai-backend

# Virtual Threads
spring.threads.virtual.enabled=true

# PostgreSQL / Neon
spring.datasource.url=${DATABASE_JDBC_URL:jdbc:postgresql://localhost:5432/dreamphysic}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.validation-timeout=10000
spring.datasource.hikari.initialization-fail-timeout=30000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.connection-test-query=SELECT 1

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# JWT
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
app.jwt.expiration-ms=86400000

# Gemini API
app.gemini.api-key=${GEMINI_API_KEY:your-gemini-api-key}
app.gemini.base-url=https://generativelanguage.googleapis.com/v1beta
app.gemini.model=gemini-2.0-flash

# Cache
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=500,expireAfterWrite=600s

# CORS
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000,capacitor://localhost

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
