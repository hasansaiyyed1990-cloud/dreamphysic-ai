<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">DreamPhysic AI adaptive icon background</title>
  <desc id="desc">Obsidian background layer for the Android adaptive icon, with a subtle teal and purple glow.</desc>
  <defs>
    <radialGradient id="glowTeal" cx="42%" cy="38%" r="58%">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowPurple" cx="80%" cy="84%" r="52%">
      <stop offset="0" stop-color="#a855f7" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Full-bleed obsidian fill: the adaptive icon mask shapes this layer -->
  <rect width="1024" height="1024" fill="#05070c"/>
  <rect width="1024" height="1024" fill="url(#glowTeal)"/>
  <rect width="1024" height="1024" fill="url(#glowPurple)"/>
</svg>
