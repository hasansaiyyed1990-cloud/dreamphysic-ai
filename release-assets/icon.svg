<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">DreamPhysic AI app icon</title>
  <desc id="desc">Geometric dumbbell with a gold pulse line, teal-to-purple gradient on an obsidian background.</desc>
  <defs>
    <linearGradient id="brand" x1="140" y1="140" x2="884" y2="884" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <radialGradient id="glowTeal" cx="50%" cy="42%" r="55%">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowPurple" cx="78%" cy="82%" r="50%">
      <stop offset="0" stop-color="#a855f7" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Obsidian background: full bleed so launcher masks never show transparent corners -->
  <rect width="1024" height="1024" fill="#05070c"/>
  <rect width="1024" height="1024" fill="url(#glowTeal)"/>
  <rect width="1024" height="1024" fill="url(#glowPurple)"/>

  <!-- Thin orbit ring: keeps the mark contained and readable at small sizes -->
  <circle cx="512" cy="512" r="384" fill="none" stroke="url(#brand)" stroke-width="18" opacity="0.45"/>

  <!-- Dumbbell: outer plates -->
  <rect x="150" y="424" width="58" height="176" rx="18" fill="url(#brand)"/>
  <rect x="816" y="424" width="58" height="176" rx="18" fill="url(#brand)"/>
  <!-- Dumbbell: inner plates -->
  <rect x="228" y="384" width="70" height="256" rx="22" fill="url(#brand)"/>
  <rect x="726" y="384" width="70" height="256" rx="22" fill="url(#brand)"/>
  <!-- Dumbbell: bar -->
  <rect x="286" y="470" width="452" height="84" rx="42" fill="url(#brand)"/>

  <!-- Gold pulse through the bar: training + health signal in one stroke -->
  <polyline points="344,512 438,512 472,436 526,590 562,512 680,512"
            fill="none" stroke="#fbbf24" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="680" cy="512" r="17" fill="#fbbf24"/>
</svg>
